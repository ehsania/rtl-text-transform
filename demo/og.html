<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rtl-text-transform — OG</title>
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("/fonts/Vazirmatn[wght].woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #d0d0d0;
      }
      .og {
        width: 1200px;
        height: 630px;
        padding: 64px 72px 58px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #f5f5f5;
        color: #111111;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .top,
      .bottom {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
      }
      .top {
        padding-bottom: 22px;
        border-bottom: 1px solid #d0d0d0;
      }
      .name {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 23px;
        letter-spacing: -0.02em;
      }
      .version {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 16px;
        color: #5c5c5c;
      }
      .label {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 15px;
        letter-spacing: 0.12em;
        color: #5c5c5c;
        text-transform: uppercase;
      }
      .word {
        direction: rtl;
        font-family: "Vazirmatn", sans-serif;
        font-size: 188px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0;
      }
      .word .changed {
        color: #666666;
      }
      .pair {
        margin-top: 18px;
        font-family: "Vazirmatn", sans-serif;
        font-size: 27px;
        color: #5c5c5c;
        direction: rtl;
      }
      .bottom {
        padding-top: 22px;
        border-top: 1px solid #d0d0d0;
        align-items: flex-end;
      }
      .pitch {
        max-width: 640px;
        font-size: 24px;
        line-height: 1.45;
        color: #5c5c5c;
      }
      .pitch strong {
        color: #111111;
        font-weight: 650;
      }
      .mark {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 15px;
        color: #5c5c5c;
      }
    </style>
  </head>
  <body>
    <div
      class="og"
      id="og"
      role="img"
      aria-label="rtl-text-transform — shared letters stay, changed letters dissolve"
      tabindex="0"
    >
      <div class="top">
        <span class="name">rtl-text-transform</span>
        <span class="version">v0.1.0</span>
      </div>
      <div>
        <p class="label" style="margin: 0 0 16px">The effect</p>
        <div class="word"><span>کتاب</span><span class="changed">ها</span></div>
        <p class="pair">کتاب ⇄ کتاب‌ها</p>
      </div>
      <div class="bottom">
        <p class="pitch">
          <strong>Shared letters stay. Changed letters dissolve.</strong><br />Goo and rise text
          morphs for Arabic and Persian.
        </p>
        <span class="mark">zero runtime deps</span>
      </div>
    </div>
  </body>
</html>
