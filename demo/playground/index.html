<!doctype html>
<html lang="en" dir="ltr" data-theme="light" data-theme-preference="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground — rtl-text-transform</title>
    <meta
      name="description"
      content="Tune every rtl-text-transform example: words, counters, buttons, tabs and toasts, with shared morph controls."
    />
    <meta name="theme-color" content="#f5f5f5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        var key = "rtl-text-transform-theme";
        var preference = "system";
        try {
          var stored = localStorage.getItem(key);
          if (stored === "light" || stored === "dark" || stored === "system") {
            preference = stored;
          }
        } catch (error) {}
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme =
          preference === "light" || preference === "dark"
            ? preference
            : systemDark
              ? "dark"
              : "light";
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.themePreference = preference;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "dark" ? "#0d0d0d" : "#f5f5f5");
        }
      })();
    </script>
    <link rel="stylesheet" href="/landing/site.css" />
    <script type="module" src="/playground/main.ts"></script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="site-header-top">
          <div class="identity">
            <h1><a class="site-title" href="../">rtl-text-transform</a></h1>
            <span class="version">v0.1.0</span>
          </div>
          <div class="header-actions">
            <nav class="icon-links" aria-label="Project links">
              <a
                class="icon-button"
                data-link="github"
                data-icon="github"
                href="https://github.com/ehsania/rtl-text-transform"
                aria-label="GitHub"
                title="GitHub"
              ></a>
            </nav>
            <button
              class="theme-cycle icon-button"
              type="button"
              data-theme-cycle
              data-icon="system"
              aria-label="Theme: System"
              title="Theme: System"
            ></button>
          </div>
        </div>
        <p class="tagline">fluid text transition for rtl language</p>
        <p class="reduced-note" data-reduced-note hidden>
          Reduced motion is on — morphs use a short opacity cross-fade.
        </p>
      </header>

      <main class="playground-main">
        <section class="playground-intro" aria-labelledby="playground-title">
          <h2 class="sr-only" id="playground-title">Example playground</h2>
          <div class="playground-tabs-shell">
            <div
              class="playground-tabs"
              data-example-tabs
              role="tablist"
              aria-label="Example"
            ></div>
          </div>
          <p class="playground-description" data-example-description></p>
        </section>

        <section class="playground-preview" aria-label="Example preview">
          <div
            class="playground-stage-host"
            id="playground-panel"
            data-stage-host
            role="tabpanel"
          ></div>
        </section>

        <section class="playground-controls" aria-label="Example controls">
          <div class="playground-toolbar" data-toolbar></div>
          <div class="playground-groups">
            <div class="playground-specific" data-specific-host hidden></div>
            <div class="playground-shared" data-shared-host></div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>rtl-text-transform v0.1.0 · MIT</span>
        <nav aria-label="Footer links">
          <a data-link="github" href="https://github.com/ehsania/rtl-text-transform">GitHub</a>
          <a data-link="npm" href="https://www.npmjs.com/package/rtl-text-transform">npm</a>
          <a href="https://x.com/4lign" rel="me">X</a>
          <a href="https://a1ign.top" rel="me">Ali Ehsanfar</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
